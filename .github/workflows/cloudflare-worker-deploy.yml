name: Deploy Otya Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy a separate preview Worker or the production Worker."
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: otya-cloudflare-worker-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy headless Worker
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    defaults:
      run:
        working-directory: platforms/cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_TARGET: ${{ inputs.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
          rustup target add wasm32-unknown-unknown

      - name: Restrict production deployments to main
        if: inputs.target == 'production'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deployments can only run from main." >&2
            exit 1
          fi

      - name: Require operator-owned Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          }

      - name: Install pinned workers-rs build tool
        run: cargo install worker-build --version 0.8.7

      - name: Select isolated Worker name
        run: |
          if [ "$DEPLOYMENT_TARGET" = "production" ]; then
            echo "WORKER_NAME=otya-engine-edge" >> "$GITHUB_ENV"
          else
            echo "WORKER_NAME=otya-engine-edge-preview" >> "$GITHUB_ENV"
          fi

      - name: Build and validate Worker bundle
        run: |
          worker-build --release
          npx --yes wrangler@4.169.0 deploy --dry-run --name "$WORKER_NAME"

      - name: Deploy Worker
        run: npx --yes wrangler@4.169.0 deploy --name "$WORKER_NAME"
