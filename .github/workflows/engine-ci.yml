name: Otya Engine CI

on:
  push:
    branches:
      - main
      - "engine-only/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otya-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: CLI local diagnostics smoke tests
        run: |
          cargo run -p otya-engine-cli -- doctor --json
          cargo run -p otya-engine-cli -- paths --json

      - name: Validate example configuration
        run: cargo run -p otya-engine-cli -- config validate --file examples/otya-engine.toml

      - name: Build release binaries
        run: cargo build --workspace --release

  minimum-supported-rust:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MSRV Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Compile and test on MSRV
        run: |
          cargo check --workspace
          cargo test --workspace --all-targets
